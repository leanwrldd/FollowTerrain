[AccessTransformers]
; Filter only the floor rejection, including standalone and stackable supports.
Friend=(Class="AFGHologram", FriendClass="FTerrainBeltsModule")
Friend=(Class="AFGBuildableHologram", FriendClass="FTerrainBeltsModule")
Friend=(Class="AFGFactoryBuildingHologram", FriendClass="FTerrainBeltsModule")
; GenerateAndUpdateSpline / UpdateSplineComponent are protected or private, the incline and
; grade limits are private, and mSplineData is protected on AFGSplineHologram (reachable
; through each subclass).
Friend=(Class="AFGConveyorBeltHologram", FriendClass="FTerrainBeltsModule")
Friend=(Class="AFGPipelineHologram", FriendClass="FTerrainBeltsModule")
Friend=(Class="AFGRailroadTrackHologram", FriendClass="FTerrainBeltsModule")
; Auto-lift: the lift's top transform, height limits, connections and ConfigureComponents.
Friend=(Class="AFGConveyorLiftHologram", FriendClass="FTerrainBeltsModule")
